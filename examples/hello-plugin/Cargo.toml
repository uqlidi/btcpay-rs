[package]
name = "hello-plugin"
description = "A minimal BTCPay Server plugin written in Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# Every btcpay-rs plugin builds its cdylib under this name, never the crate's own name.
# The generated C# bakes it into [DllImport], so a fixed name is what lets one set of
# bindings ship inside BtcpayRs.Host instead of being regenerated per plugin. Plugins stay
# isolated regardless: each lives in its own AssemblyLoadContext and its own directory, and
# the loader resolves by absolute path.
name = "btcpay_plugin_native"

[dependencies]
btcpay-plugin.workspace = true
