name: Build toolchain image

# The image carries Rust and the .NET SDK together, plus the pinned binding generator. It is
# ~1.8 GB and takes about ten minutes to build, most of it compiling uniffi-bindgen-cs, so it
# is built only when its definition changes and pulled by every other workflow.
on:
  push:
    branches: [master, main]
    paths:
      - docker/build.Dockerfile
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - docker/build.Dockerfile
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}-build

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests from forks cannot push, so they build to verify the Dockerfile only.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by the Dockerfile's content, so a workflow can pin the exact toolchain it was
      # tested against, and an unchanged Dockerfile reuses the existing image.
      - name: Compute the image tag
        id: tag
        run: echo "hash=$(sha256sum docker/build.Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/build.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tag.outputs.hash }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
