[package]
name = "cargo-btcpay"
description = "Scaffold, build and package BTCPay Server plugins written in Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cargo-btcpay"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
