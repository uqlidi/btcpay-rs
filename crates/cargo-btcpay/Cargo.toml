[package]
name = "cargo-btcpay"
description = "Scaffold, build and package BTCPay Server plugins written in Rust."
readme = "README.md"
keywords = ["btcpay", "bitcoin", "plugin", "cargo", "cli"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Cargo follows the `dotnet/` symlink but stops applying .gitignore past it, so the build output
# needs excluding by hand.
exclude = [
    "dotnet/**/bin/**",
    "dotnet/**/obj/**",
    "dotnet/**/Generated/**",
]
rust-version.workspace = true

[[bin]]
name = "cargo-btcpay"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
