[package]
name = "btcpay-ui"
description = "Describe a BTCPay plugin's settings page and dashboard as data."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Deliberately no uniffi dependency. The UI tree crosses the FFI as JSON inside a single
# string field, not as generated types, so that adding a node type is a wire-format change
# the host can degrade over rather than an ABI break every plugin must be rebuilt for.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
