[package]
name = "btcpay-plugin-macros"
description = "Procedural macros for btcpay-plugin."
readme = "README.md"
keywords = ["btcpay", "bitcoin", "plugin", "macros", "derive"]
categories = ["development-tools::procedural-macro-helpers"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
# `extra-traits` gives syn's types `Debug` and `PartialEq`, which `Kind` derives.
syn = { version = "2", features = ["full", "extra-traits"] }
